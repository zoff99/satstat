name: Android startup tab 2

on:
  push:
    paths-ignore:
      - 'README.md'
  pull_request:
    paths-ignore:
      - 'README.md'
  workflow_dispatch:
    inputs:
      version:
        description: dummy
        default: dummy

jobs:
  android-startup-app:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        api-level: [35, 33, 29, 24]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update && \
          sudo DEBIAN_FRONTEND=noninteractive \
          apt-get install -y --no-install-recommends \
          fonts-freefont-otf \
          adb \
          ghostscript \
          imagemagick \
          ca-certificates

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build APK
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug --stacktrace

      - name: Android emulator test
        timeout-minutes: 30
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          profile: pixel_6
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-snapshot-save -skin 1080x2220 -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          disable-spellchecker: true
          script: |
            adb install app/build/outputs/apk/debug/app-debug.apk
            # Grant runtime permissions before first launch so the GPS tab populates immediately
            # instead of showing a permission dialog.
            adb shell pm grant com.zoffcc.applications.satstat android.permission.ACCESS_FINE_LOCATION
            adb shell pm grant com.zoffcc.applications.satstat android.permission.ACCESS_COARSE_LOCATION
            # Phone state for the radio tab (optional — requires READ_PHONE_STATE in manifest)
            adb shell pm grant com.zoffcc.applications.satstat android.permission.READ_PHONE_STATE
            # Notifications for API 33+ (POST_NOTIFICATIONS is runtime-only on 13+)
            # adb shell pm grant com.zoffcc.applications.satstat android.permission.POST_NOTIFICATIONS
            adb shell am start -n com.zoffcc.applications.satstat/com.vonglasow.michael.satstat.ui.MainActivity &
            sleep 90
            # Swipe left to move from tab 1 (GPS) to tab 2 (Sensors)
            adb shell input swipe 800 1000 200 1000 300
            sleep 5
            adb exec-out screencap -p > ~/android_screen02_${{ matrix.api-level }}.png
            ls -al ~/android_screen02_${{ matrix.api-level }}.png
            adb logcat -d | grep -i 'satstat\|vonglasow\|zoffcc' || true
            adb logcat -d > ~/adb_log.txt
            sleep 2

      - name: Upload screenshot
        uses: actions/upload-artifact@v4
        with:
          name: android_startup_02_${{ matrix.api-level }}
          path: /home/runner/android_screen02_${{ matrix.api-level }}.png

      - name: Upload logcat
        uses: actions/upload-artifact@v4
        with:
          name: android_startup_adb_log_02_${{ matrix.api-level }}
          path: /home/runner/adb_log.txt

      - name: Upload to nightly release
        uses: ncipollo/release-action@v1
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/master'
        with:
          allowUpdates: true
          tag: nightly
          omitBodyDuringUpdate: true
          omitNameDuringUpdate: true
          prerelease: true
          replacesArtifacts: true
          token: ${{ secrets.GITHUB_TOKEN }}
          artifacts: "/home/runner/android_screen02_${{ matrix.api-level }}.png"

