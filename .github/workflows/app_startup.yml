name: Android startup

on:
  push:
    paths-ignore:
      - 'README.md'
  pull_request:
    paths-ignore:
      - 'README.md'
  workflow_dispatch:
    inputs:
      version:
        description: dummy
        default: dummy

jobs:
  update-nightly-tag:
    name: Update nightly release tag
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Move nightly tag to head for nightly release
        run: git tag -f nightly && git push origin nightly -f

  android-startup-app:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        api-level: [35, 33, 29, 24]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Install deps
        run: |
          sudo apt-get update && \
          sudo DEBIAN_FRONTEND=noninteractive \
          apt-get install -y --no-install-recommends \
          fonts-freefont-otf \
          adb \
          ghostscript \
          imagemagick \
          ca-certificates

      - name: Install Java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build APK
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug --stacktrace

      - name: Android emulator test
        timeout-minutes: 30
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          profile: pixel_6
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-snapshot-save -skin 1080x2220 -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          disable-spellchecker: true
          script: |
            adb install app/build/outputs/apk/debug/app-debug.apk
            # Grant runtime permissions before first launch so the GPS tab populates immediately
            # instead of showing a permission dialog.
            adb shell pm grant com.zoffcc.applications.satstat android.permission.ACCESS_FINE_LOCATION
            adb shell pm grant com.zoffcc.applications.satstat android.permission.ACCESS_COARSE_LOCATION
            # Phone state for the radio tab (optional — requires READ_PHONE_STATE in manifest)
            adb shell pm grant com.zoffcc.applications.satstat android.permission.READ_PHONE_STATE
            # Notifications for API 33+ (POST_NOTIFICATIONS is runtime-only on 13+)
            # adb shell pm grant com.zoffcc.applications.satstat android.permission.POST_NOTIFICATIONS
            adb shell am start -n com.zoffcc.applications.satstat/com.vonglasow.michael.satstat.ui.MainActivity &
            sleep 30
            # Inject multi-constellation satellite data via NMEA GSV sentences.
            # Checksums are computed at runtime so they're always valid.
            python3 - <<'EOF'
            import subprocess, time
            def cs(s):
                c = 0
                for ch in s: c ^= ord(ch)
                return format(c, '02X')
            def gsv(talker, total_msgs, msg_num, total_sats, sats):
                f = [f"{talker}GSV", str(total_msgs), str(msg_num), str(total_sats)]
                for svid, elev, azim, snr in sats:
                    f += [f"{svid:02d}", str(elev), str(azim), str(snr)]
                body = ','.join(f)
                return f"${body}*{cs(body)}"
            # GPS svid 1-32 -> app PRN 1-32 | GLONASS slot 1-24 -> app PRN 65-88 | Galileo svid 1-36 -> app PRN 301-336
            sentences = [
                gsv('GP', 1, 1, 4, [(1,60,120,45),(2,50,150,40),(3,40,180,35),(4,30,210,30)]),
                gsv('GL', 1, 1, 3, [(1,55,100,42),(2,45,130,38),(3,35,160,33)]),
                gsv('GA', 1, 1, 3, [(1,65,90,44),(2,52,140,39),(3,41,170,34)]),
            ]
            for s in sentences:
                subprocess.run(['adb', 'emu', 'geo', 'nmea', s])
                time.sleep(0.2)
            EOF
            sleep 20
            adb exec-out screencap -p > ~/android_screen01_${{ matrix.api-level }}.png
            ls -al ~/android_screen01_${{ matrix.api-level }}.png
            adb logcat -d | grep -i 'satstat\|vonglasow\|zoffcc' || true
            adb logcat -d > ~/adb_log.txt
            sleep 2

      - name: Upload screenshot
        uses: actions/upload-artifact@v7
        with:
          name: android_startup_${{ matrix.api-level }}
          path: /home/runner/android_screen01_${{ matrix.api-level }}.png

      - name: Upload logcat
        uses: actions/upload-artifact@v7
        with:
          name: android_startup_adb_log_${{ matrix.api-level }}
          path: /home/runner/adb_log.txt

      - name: Upload to nightly release
        uses: ncipollo/release-action@v1
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/master'
        with:
          allowUpdates: true
          tag: nightly
          omitBodyDuringUpdate: true
          omitNameDuringUpdate: true
          prerelease: true
          replacesArtifacts: true
          token: ${{ secrets.GITHUB_TOKEN }}
          artifacts: "/home/runner/android_screen01_${{ matrix.api-level }}.png"
